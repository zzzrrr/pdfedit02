<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<title>頁作 2.2 更新器</title>
<style>
  body { max-width: 540px; margin: 12vh auto; padding: 24px;
         font: 16px/1.7 system-ui, sans-serif; color: #34452f }
  input, a { display: block; margin: 18px 0 }
  a { color: #365b2d }
  [hidden] { display: none }
</style>
<h1>頁作 2.2 更新器</h1>
<label>選擇頁作 2.1 的 HTML 檔案
  <input id="file" type="file" accept=".html,.htm">
</label>
<p id="status" role="status"></p>
<a id="download" download="index.html" hidden>下載新版 index.html</a>

<script>
function spacingEngine() {
  const measured = new WeakMap();

  function groupLines(content, vp) {
    const raw = [], rows = [], out = [];
    content.items.forEach((item, i) => {
      if (!item.str) return;
      const [r] = extractRegions(
        { styles: content.styles, items: [{ ...item, str: "x" }] }, vp
      );
      Object.assign(r, { text: item.str, id: "s" + i, sourceIds: [i] });
      if (item.dir === "rtl" || Math.abs(r.angle) > .01) {
        if (r.text.trim()) out.push(r);
      } else {
        raw.push(r);
      }
    });

    for (const r of raw.sort((a, b) => b.size - a.size)) {
      let row = rows.find(v => Math.abs(v.y - r.baselineY) <= .15 * r.size);
      if (!row && /^[\d()+−-]{1,4}$/.test(r.text)) {
        row = rows.find(v =>
          r.size < v.size * .88 &&
          Math.abs(v.y - r.baselineY) < v.size * .55 &&
          v.items.some(p =>
            Math.max(p.x - r.x - r.w, r.x - p.x - p.w) < .35 * v.size
          )
        );
      }
      if (!row) {
        row = { y: r.baselineY, size: r.size, items: [] };
        rows.push(row);
      }
      row.items.push(r);
    }

    for (const row of rows) {
      let line = null, blank = "";
      for (const r of row.items.sort((a, b) => a.x - b.x)) {
        if (!r.text.trim()) { blank += r.text; continue; }
        const gap = line ? r.x - line.x - line.w : Infinity;
        if (!line || gap < -.25 * row.size || gap > .8 * row.size) {
          line = { ...r, pieces: [] };
          out.push(line);
        } else {
          const western = /[\p{Script=Latin}\d,.;:!?)]$/u.test(line.text)
            && /^[\p{Script=Latin}\d(]/u.test(r.text);
          const separator = /\s$/.test(line.text) || /^\s/.test(r.text)
            ? "" : blank || (western && gap > .1 * row.size &&
                             r.size > .88 * row.size ? " " : "");
          if (separator) line.pieces.push({
            t: separator, x: line.w, w: Math.max(0, gap),
            font: line.fontName, z: line.size, by: line.baselineY
          });
          line.text += separator + r.text;
          line.w = Math.max(line.w, r.x + r.w - line.x);
          line.sourceIds.push(...r.sourceIds);
          const bottom = Math.max(line.y + line.h, r.y + r.h);
          line.y = Math.min(line.y, r.y);
          line.h = bottom - line.y;
          if (r.size > line.size) {
            line.size = r.size;
            line.fontName = r.fontName;
            line.baselineY = r.baselineY;
          }
        }
        blank = "";
        line.pieces.push({
          t: r.text, x: r.x - line.x, w: r.w,
          font: r.fontName, z: r.size, by: r.baselineY
        });
      }
    }
    for (const line of out) {
      for (const p of line.pieces || []) {
        p.dy = p.by - line.y - .97 * line.size;
      }
    }
    return out.sort((a, b) => a.y - b.y || a.x - b.x);
  }

  function plain(ctx, text, style, size, baseline = null) {
    let x = 0;
    for (const token of text.split(/(\s+)/u)) {
      if (!token) continue;
      if (!token.trim()) {
        x += .28 * size * [...token].length;
        continue;
      }
      ctx.save();
      ctx.translate(x, 0);
      x += paintOriginal(ctx, token, style, size, baseline);
      ctx.restore();
    }
    return x;
  }

  function buildPlan(ctx, style, size, previous) {
    let old = previous;
    if (!old) {
      old = [];
      let end = 0;
      const scale = size / (style.baseSize || style.size);
      for (const p of style.pieces) {
        const font = S.fontRecords.get(p.font);
        const main = S.fontRecords.get(style.sourceFont || style.fontName);
        const face = {
          ...style, sourceFont: p.font,
          family: font?.family || style.family,
          italic: font?.italic ?? style.italic,
          bold: style.bold !== main?.bold ? style.bold : font?.bold ?? style.bold
        };
        if (old.length) old.at(-1).w += p.x * scale - end;
        const point = p.z * scale, dy = p.dy * scale;
        const chars = [...p.t];
        const widths = chars.map(c => plain(ctx, c, face, point));
        const blanks = chars.filter(c => !c.trim()).length;
        if (blanks && blanks < chars.length) {
          const letters = widths.reduce(
            (v, w, i) => v + (chars[i].trim() ? w : 0), 0
          );
          const gap = (p.w * scale - letters) / blanks;
          if (gap > .08 * point && gap < 1.5 * point) {
            chars.forEach((c, i) => { if (!c.trim()) widths[i] = gap; });
          }
        }
        const total = widths.reduce((a, b) => a + b, 0);
        chars.forEach((c, i) => {
          const w = p.w * scale * (total ? widths[i] / total : 1 / chars.length);
          old.push({ c, face, w, ink: w, point, dy });
        });
        end = (p.x + p.w) * scale;
      }
    }

    const now = [...style.text];
    let prefix = 0, suffix = 0;
    const limit = Math.min(now.length, old.length);
    while (prefix < limit && now[prefix] === old[prefix].c) prefix++;
    while (suffix < limit - prefix &&
           now[now.length - suffix - 1] === old[old.length - suffix - 1].c) suffix++;
    const sample = old[Math.max(0, prefix - 1)];
    const face = sample?.face || style;
    const point = sample?.point || size, dy = sample?.dy || 0;
    const inserted = now.slice(prefix, now.length - suffix).map(c => ({
      c, face, point, dy, w: plain(ctx, c, face, point)
    }));
    return old.slice(0, prefix).concat(inserted, suffix ? old.slice(-suffix) : []);
  }

  function lineWidthOrPaint(ctx, text, style, size, baseline = null, offset) {
    if (!style.pieces || style.useOriginal === false) {
      return plain(ctx, text, style, size, baseline);
    }
    const key = [size, style.family, style.bold, style.italic].join("|");
    let entry = measured.get(style);
    if (!entry || entry.key !== key || entry.text !== style.text) {
      entry = {
        key, text: style.text,
        chars: buildPlan(ctx, style, size, entry?.key === key ? entry.chars : null)
      };
      measured.set(style, entry);
    }

    const index = offset ?? style.text.indexOf(text);
    if (index < 0) return plain(ctx, text, style, size, baseline);
    const start = [...style.text.slice(0, index)].length;
    let x = 0;
    for (const g of entry.chars.slice(start, start + [...text].length)) {
      if (baseline !== null && g.c.trim()) {
        const natural = plain(ctx, g.c, g.face, g.point);
        ctx.save();
        ctx.translate(x, 0);
        ctx.scale(natural ? (g.ink ?? g.w) / natural : 1, 1);
        plain(ctx, g.c, g.face, g.point, baseline + g.dy);
        ctx.restore();
      }
      x += g.w;
    }
    return x;
  }
}

function updatePage(html) {
  html = html.replace(/\r\n?/g, "\n");
  function change(before, after) {
    if (html.split(before).length !== 2) {
      throw Error("檔案與頁作 2.1 版不符，請重新選擇原版 index.html。");
    }
    html = html.replace(before, () => after);
  }
  const source = spacingEngine.toString();
  const engine = source.slice(source.indexOf("{") + 1, source.lastIndexOf("}"));

  change("function lineWidthOrPaint(ctx, text, style, size, baseline=null) {",
         "function paintOriginal(ctx, text, style, size, baseline=null) {");
  change("const regions=extractRegions(content,vp);",
         "const regions=groupLines(content,vp);");
  change("p.edits.push(e);return e;",
         "e.pieces=r.pieces;e.baseSize=r.size;p.edits.push(e);return e;");
  change("function extractRegions(content,viewport){",
         engine + "\nfunction extractRegions(content,viewport){");
  change("const lines=[];\n    for (const paragraph",
         "const lines=[],offsets=[];let start=0;\n    for (const paragraph");
  change("line+character,edit,size)>", "line+character,edit,size,null,start)>");
  change("lines.push(line);line=character;",
         "offsets.push(start);start+=line.length;lines.push(line);line=character;");
  change("      lines.push(line);\n    }",
         "      offsets.push(start);start+=line.length+1;lines.push(line);\n    }");
  change("size,lineHeight,lines,overflow:", "size,lineHeight,lines,offsets,overflow:");
  change("lines.some(line=>lineWidthOrPaint(ctx,line,edit,size)>",
         "lines.some((line,i)=>lineWidthOrPaint(ctx,line,edit,size,null,offsets[i])>");
  change("line,edit,layout.size,baseline);",
         "line,edit,layout.size,baseline,layout.offsets[i]);");

  return html.replaceAll("頁作 2.1", "頁作 2.2")
             .replaceAll("Pagecraft 2.1", "Pagecraft 2.2")
             .replace('<span class="badge">2.1</span>', '<span class="badge">2.2</span>');
}

const file = document.getElementById("file");
const status = document.getElementById("status");
const download = document.getElementById("download");
let lastURL;
file.onchange = async () => {
  download.hidden = true;
  if (lastURL) URL.revokeObjectURL(lastURL);
  if (!file.files.length) return;
  try {
    const html = updatePage(await file.files[0].text());
    lastURL = URL.createObjectURL(new Blob([html], { type: "text/html;charset=utf-8" }));
    download.href = lastURL;
    download.hidden = false;
    status.textContent = "已產生頁作 2.2。";
  } catch (error) {
    status.textContent = error.message;
  }
};
</script>
</html>
